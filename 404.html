<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>shanks//lab</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0b0f0d;
      overflow: hidden;
    }

    iframe {
      border: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #0b0f0d;
    }
  </style>
</head>
<body>
  <iframe id="siteFrame" loading="eager" referrerpolicy="no-referrer-when-downgrade" title="shanks site"></iframe>

  <script>
    (function () {
      var origin = 'https://shanksfigarland.github.io';
      var projectBase = '/shanks.github.io';
      var path = window.location.pathname;

      if (path === '/404.html') {
        path = '/';
      }

      if (path.indexOf(projectBase + '/') === 0) {
        path = path.slice(projectBase.length);
      }

      var target = origin + projectBase + (path === '/' ? '/' : path) + window.location.search + window.location.hash;
      document.getElementById('siteFrame').src = target;
    })();
  </script>
</body>
</html>
